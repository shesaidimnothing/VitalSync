apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalsync-frontend
  labels:
    app: vitalsync
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vitalsync
      tier: frontend
  template:
    metadata:
      labels:
        app: vitalsync
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: vitalsync/frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
